services:
  db:
    image: mysql:5.7
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_net

  wordpress:
    image: wordpress:latest
    restart: always
    env_file: .env
    ports:
      - "8084:80"   
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_net
    depends_on:
      - db

  

volumes:
  db_data:
  wp_data:
  

networks:
  wp_net:
    driver: bridge
