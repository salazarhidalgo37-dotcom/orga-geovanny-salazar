services:
  db:
    image: mysql:5.7
    container_name: mysql_wp
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_net

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    env_file: .env
    ports:
      - "8084:80"   
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_net
    depends_on:
      - db

  jenkins:
    build: .
    container_name: jenkins_server
    restart: always
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   
    networks:
      - wp_net

volumes:
  db_data:
  wp_data:
  jenkins_data:

networks:
  wp_net:
    driver: bridge
